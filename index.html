  .hero-nav{ display:flex; justify-content:space-between; align-items:center; padding:28px 44px; }
  .hero-logo img{ height:82px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.45)); }
  .hero-links{ display:flex; gap:10px; flex-wrap:wrap; }
  .lang-btn{ background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.35);
    padding:6px 14px; border-radius:20px; font-size:0.78rem; font-family:'Questrial', sans-serif;
    letter-spacing:0.5px; cursor:pointer; transition:all .15s ease; }
  .lang-btn:hover{ background:rgba(255,255,255,0.22); }
  .lang-btn.active{ background:var(--brand-gold); color:#3a2a10; font-weight:700; border-color:var(--brand-gold); }
  .hero-center{ text-align:center; padding:0 20px 70px; }
  .hero-center h1{ font-family:'Raleway', sans-serif; font-weight:700; font-size:2.6rem; letter-spacing:3px; text-transform:uppercase; margin-top:14px; }
  .hero-center p{ margin-top:16px; font-family:'Raleway', sans-serif; font-size:0.8rem; letter-spacing:2.5px; text-transform:uppercase; opacity:0.85; }
  @media (max-width:680px){
    .hero-nav{ padding:20px 20px; flex-wrap:wrap; gap:14px; justify-content:center; }
    .hero-logo img{ height:58px; }
    .hero-center h1{ font-size:1.7rem; letter-spacing:1.5px; }
  }

.sticky-header{ position:sticky; top:0; z-index:20; box-shadow:0 2px 6px rgba(0,0,0,0.04); }

.info-bar{ background:var(--card); border-bottom:1px solid var(--border); padding:12px 16px;
  display:flex; justify-content:center; gap:24px; flex-wrap:wrap; font-size:0.8rem; color:var(--muted); }
.info-bar strong{ color:var(--brand-red); }

.cat-menu-wrap{ background:var(--bg); border-bottom:1px solid var(--border); }
  .cat-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card); border:none; border-top:1px solid var(--border); padding:14px 16px;
    font-family:'Questrial', sans-serif; font-size:0.9rem; color:var(--brand-red); cursor:pointer;
  }
  .cat-toggle:hover{ color:var(--brand-hover); }
  .cat-toggle .chevron{ transition:transform .2s ease; }
  .cat-toggle[aria-expanded="true"] .chevron{ transform:rotate(180deg); }
  .cat-list{
    list-style:none; margin:0; padding:0; max-height:0; overflow:hidden; transition:max-height .25s ease;
    background:var(--card); border-top:0;
  }
  .cat-list.open{ max-height:70vh; overflow-y:auto; border-top:1px solid var(--border); }
  .cat-list li{ border-bottom:1px solid var(--border); }
  .cat-list a{
    display:block; width:100%; padding:14px 20px; color:var(--text); text-decoration:none;
    font-size:0.95rem; transition:background .12s ease;
  }
  .cat-list a:hover, .cat-list a:focus{ background:#fbf2e4; color:var(--brand-red); }

  main{ max-width:680px; margin:0 auto; padding:20px 16px; }
  .category{ margin-top:30px; scroll-margin-top:130px; }
  .category h2{ color:var(--brand-red); font-family:'Raleway', sans-serif; font-weight:700; font-size:1.3rem;
    padding-bottom:8px; margin-bottom:14px; border-bottom:2px solid var(--brand-gold); display:inline-block; }
  .dish{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px;
    margin-bottom:10px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    transition:box-shadow .15s ease; }
  .dish:hover{ box-shadow:0 4px 14px rgba(0,0,0,0.06); }
  .dish-info{ flex:1; }
  .dish-name{ font-weight:700; font-size:1rem; }
  .dish-desc{ font-size:0.86rem; color:var(--muted); margin-top:4px; line-height:1.4; }
  .dish-icons{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .dish-icons:empty{ display:none; margin-top:0; }
  .icon-badge{ position:relative; width:22px; height:22px; border-radius:50%; background:#fbf2e4;
    border:1px solid var(--border); color:var(--brand-red); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:0 0 auto; }
  .icon-badge svg{ width:13px; height:13px; }
  .icon-tooltip{ position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:#2b2320; color:#fff; font-size:0.72rem; font-family:'Questrial',sans-serif;
    padding:6px 10px; border-radius:6px; white-space:normal; text-align:center;
    max-width:min(220px, 78vw); width:max-content; z-index:30; opacity:0; pointer-events:none;
    transition:opacity .12s ease; }
  .icon-tooltip::after{ content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:5px solid transparent; border-top-color:#2b2320; }
  .icon-badge:hover .icon-tooltip, .icon-badge.show-tip .icon-tooltip{ opacity:1; }
  .dish-price{ font-weight:700; white-space:nowrap; font-size:0.95rem; color:var(--brand-red); text-align:right; min-width:80px; }

  .legend{ margin-top:50px; background:#211a17; color:#fff; border-radius:14px; padding:26px 22px; }
  .legend h3{ font-family:'Raleway',sans-serif; font-size:1.15rem; color:var(--brand-gold); margin-bottom:4px; }
  .legend .hint{ font-size:0.78rem; color:#c9beb4; margin-bottom:18px; }
  .legend-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:18px 10px; }

const SUPPORTED = ["de","en","it","fr","es","sv","da"];

function slugify(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
function detectDefaultLang(){
  const browserLang = navigator.language.slice(0,2);
  return SUPPORTED.includes(browserLang) ? browserLang : "de";
}
function iconBadge(key, label){
  return `<span class="icon-badge" tabindex="0" data-icon="${key}">${ICON_SVG[key]}<span class="icon-tooltip">${label}</span></span>`;
}

function render(lang){
  if(!MENU_DATA[lang]){ lang = "de"; }
  const data = MENU_DATA[lang];
  document.getElementById('hero-title').textContent = "Ristorante Buona Sera";
  document.getElementById('hero-tagline').textContent = data.tagline;
  document.getElementById('footer-note').textContent = data.footer;
  document.getElementById('hours').innerHTML = `<strong>${data.hours_label}:</strong> ${data.hours_text}`;
  document.getElementById('cat-toggle-label').textContent = data.cat_menu_label;
  document.querySelectorAll('.lang-btn').forEach(b=>{ b.classList.toggle('active', b.dataset.lang === lang); });

  const root = document.getElementById('menu-root');
  const catList = document.getElementById('cat-list');
  root.innerHTML = ''; catList.innerHTML = '';

  data.categories.forEach(cat=>{
    const slug = slugify(cat.name);
    const li = document.createElement('li');
    li.setAttribute('role','none');
    li.innerHTML = `<a href="#${slug}" role="menuitem">${cat.name}</a>`;
    catList.appendChild(li);

    const catDiv = document.createElement('div');
    catDiv.className = 'category'; catDiv.id = slug;
    catDiv.innerHTML = `<h2>${cat.name}</h2>`;
    cat.items.forEach(item=>{
      const iconsHtml = (item.icons||[]).map(k => iconBadge(k, data.icon_labels[k] || k)).join('');
      catDiv.innerHTML += `
        <div class="dish">
          <div class="dish-info">
            <div class="dish-name">${item.name}</div>
            <div class="dish-desc">${item.desc}</div>
            <div class="dish-icons">${iconsHtml}</div>
          </div>
          <div class="dish-price">${item.price}</div>
        </div>`;
    });
    root.appendChild(catDiv);
  });

  const legendKeys = ["dairy","nuts","fish","egg","gluten_free","gf_request","lactose_free","vegan","vegetarian","spicy"];
  const legendDiv = document.createElement('div');
  legendDiv.className = 'legend';
  legendDiv.innerHTML = `<h3>${data.legend_title}</h3><div class="hint">${data.legend_hint}</div>
    <div class="legend-grid">${legendKeys.map(k=>`
      <div class="legend-item"><div class="circle">${ICON_SVG[k]}</div><div class="label">${data.icon_labels[k] || k}</div></div>`).join('')}</div>`;
  root.appendChild(legendDiv);

  // re-attach category link close-on-click behaviour after rebuilding list
  catList.querySelectorAll('a').forEach(a=>{
    a.addEventListener('click', ()=>{
      catList.classList.remove('open');
      document.getElementById('cat-toggle').setAttribute('aria-expanded','false');
    });
  });

  document.documentElement.lang = lang;
  localStorage.setItem('menuLang', lang);
  document.querySelectorAll('.icon-badge').forEach(badge=>{
    badge.addEventListener('mouseenter', ()=> positionTooltip(badge));
  });
}

const catToggle = document.getElementById('cat-toggle');
const catList = document.getElementById('cat-list');
catToggle.addEventListener('click', ()=>{
  const isOpen = catList.classList.toggle('open');
  catToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
});

function positionTooltip(badge){
  const tip = badge.querySelector('.icon-tooltip');
  if(!tip) return;
  tip.style.left = '50%';
  tip.style.transform = 'translateX(-50%)';
  const rect = tip.getBoundingClientRect();
  const margin = 8;
  let shift = 0;
  if(rect.left < margin){
    shift = margin - rect.left;
  } else if(rect.right > window.innerWidth - margin){
    shift = (window.innerWidth - margin) - rect.right;
  }
  if(shift !== 0){
    tip.style.transform = `translateX(calc(-50% + ${shift}px))`;
  }
}

document.addEventListener('click', (e)=>{
  const badge = e.target.closest('.icon-badge');
  document.querySelectorAll('.icon-badge.show-tip').forEach(b=>{ if(b !== badge) b.classList.remove('show-tip'); });
  if(badge){
    const wasOpen = badge.classList.contains('show-tip');
    badge.classList.toggle('show-tip');
    if(!wasOpen){ positionTooltip(badge); }
  }
});

document.querySelectorAll('.icon-badge').forEach(badge=>{
  badge.addEventListener('mouseenter', ()=> positionTooltip(badge));
});

document.querySelectorAll('.lang-btn').forEach(btn=>{ btn.addEventListener('click', ()=> render(btn.dataset.lang)); });

const savedLang = localStorage.getItem('menuLang');
render(savedLang && SUPPORTED.includes(savedLang) ? savedLang : detectDefaultLang());
</script>
