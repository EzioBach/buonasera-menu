<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuonaSera – Menu</title>
<style>
  :root{
    --primary:#7a1f2b;
    --bg:#fdfaf5;
    --text:#2b2320;
    --muted:#6b6259;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Georgia',serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:60px;
  }
  header{
    background:var(--primary);
    color:#fff;
    padding:20px 16px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:10;
  }
  header h1{font-size:1.6rem;letter-spacing:1px;}
  header p{font-size:0.85rem;opacity:0.85;margin-top:4px;}
  .lang-switch{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  .lang-btn{
    background:rgba(255,255,255,0.15);
    color:#fff;
    border:1px solid rgba(255,255,255,0.4);
    padding:6px 12px;
    border-radius:20px;
    font-size:0.8rem;
    cursor:pointer;
  }
  .lang-btn.active{
    background:#fff;
    color:var(--primary);
    font-weight:bold;
  }
  main{max-width:640px;margin:0 auto;padding:16px;}
  .category{margin-top:28px;}
  .category h2{
    color:var(--primary);
    font-size:1.2rem;
    border-bottom:2px solid var(--primary);
    padding-bottom:4px;
    margin-bottom:12px;
  }
  .dish{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:10px 0;
    border-bottom:1px solid #eadfd4;
  }
  .dish-info{flex:1;padding-right:12px;}
  .dish-name{font-weight:bold;font-size:1rem;}
  .dish-desc{font-size:0.85rem;color:var(--muted);margin-top:2px;}
  .dish-tags{font-size:0.75rem;color:var(--primary);margin-top:2px;}
  .dish-price{font-weight:bold;white-space:nowrap;font-size:0.95rem;text-align:right;}
  footer{
    text-align:center;
    font-size:0.75rem;
    color:var(--muted);
    margin-top:30px;
    padding:16px;
  }
  #loading{text-align:center;padding:40px;color:var(--muted);}
</style>
</head>
<body>

<header>
  <h1>BuonaSera</h1>
  <p id="subtitle">Ristorante Italiano · Lüneburg</p>
  <div class="lang-switch">
    <button class="lang-btn" data-lang="de">DE</button>
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="it">IT</button>
    <button class="lang-btn" data-lang="fr">FR</button>
    <button class="lang-btn" data-lang="es">ES</button>
    <button class="lang-btn" data-lang="sv">SV</button>
    <button class="lang-btn" data-lang="da">DA</button>
  </div>
</header>

<main id="menu-root">
  <div id="loading">Loading menu…</div>
</main>

<footer id="footer-note"></footer>

<script>
const SUPPORTED = ["de","en","it","fr","es","sv","da"];
const cache = {};

async function loadLang(lang){
  if(cache[lang]) return cache[lang];
  const res = await fetch(`menu_${lang}.json`);
  const data = await res.json();
  cache[lang] = data;
  return data;
}

function detectDefaultLang(){
  const browserLang = navigator.language.slice(0,2);
  return SUPPORTED.includes(browserLang) ? browserLang : "de";
}

async function render(lang){
  const root = document.getElementById('menu-root');
  root.innerHTML = '<div id="loading">Loading menu…</div>';
  let data;
  try{
    data = await loadLang(lang);
  }catch(e){
    root.innerHTML = '<div id="loading">Could not load menu. Please check your connection.</div>';
    return;
  }
  document.getElementById('subtitle').textContent = data.subtitle;
  document.getElementById('footer-note').textContent = data.footer;
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  root.innerHTML = '';
  data.categories.forEach(cat=>{
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    catDiv.innerHTML = `<h2>${cat.name}</h2>`;
    cat.items.forEach(item=>{
      catDiv.innerHTML += `
        <div class="dish">
          <div class="dish-info">
            <div class="dish-name">${item.name}</div>
            <div class="dish-desc">${item.desc}</div>
            ${item.allergens ? `<div class="dish-tags">${item.allergens}</div>` : ''}
          </div>
          <div class="dish-price">${item.price}</div>
        </div>`;
    });
    root.appendChild(catDiv);
  });
  document.documentElement.lang = lang;
  localStorage.setItem('menuLang', lang);
}

document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> render(btn.dataset.lang));
});

const savedLang = localStorage.getItem('menuLang');
render(savedLang && SUPPORTED.includes(savedLang) ? savedLang : detectDefaultLang());
</script>

</body>
</html>
