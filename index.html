<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ristorante Buona Sera – Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#8a1c2b;
    --primary-dark:#5c1220;
    --gold:#c9a24b;
    --bg:#faf6ef;
    --card:#ffffff;
    --text:#2b2320;
    --muted:#7a6f64;
    --border:#e8ddc9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Lato',sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:60px;
  }
  h1,h2,.brand{font-family:'Playfair Display',serif;}

  header{
    background:linear-gradient(160deg,var(--primary-dark),var(--primary));
    color:#fff;
    padding:36px 16px 22px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0;
    height:4px;
    background:linear-gradient(90deg,var(--gold),#e8cf8a,var(--gold));
  }
  .brand{font-size:2.1rem;letter-spacing:1px;font-weight:700;}
  .brand-sub{font-size:0.95rem;opacity:0.9;margin-top:6px;letter-spacing:0.5px;}
  .tagline{font-size:0.82rem;opacity:0.75;margin-top:10px;max-width:420px;margin-left:auto;margin-right:auto;font-style:italic;}

  .lang-switch{
    display:flex; justify-content:center; gap:6px;
    margin-top:20px; flex-wrap:wrap;
  }
  .lang-btn{
    background:rgba(255,255,255,0.12);
    color:#fff;
    border:1px solid rgba(255,255,255,0.35);
    padding:6px 14px;
    border-radius:20px;
    font-size:0.78rem;
    letter-spacing:0.5px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .lang-btn:hover{background:rgba(255,255,255,0.22);}
  .lang-btn.active{
    background:var(--gold);
    color:var(--primary-dark);
    font-weight:700;
    border-color:var(--gold);
  }

  .info-bar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:12px 16px;
    display:flex;
    justify-content:center;
    gap:24px;
    flex-wrap:wrap;
    font-size:0.8rem;
    color:var(--muted);
    position:sticky; top:0; z-index:20;
    box-shadow:0 2px 6px rgba(0,0,0,0.04);
  }
  .info-bar strong{color:var(--primary);}

  nav.cat-nav{
    display:flex; overflow-x:auto; gap:8px;
    padding:12px 16px; background:var(--bg);
    border-bottom:1px solid var(--border);
    position:sticky; top:41px; z-index:19;
    scrollbar-width:none;
  }
  nav.cat-nav::-webkit-scrollbar{display:none;}
  nav.cat-nav a{
    flex:0 0 auto;
    font-size:0.75rem;
    color:var(--primary);
    background:#fff;
    border:1px solid var(--border);
    padding:5px 12px;
    border-radius:14px;
    text-decoration:none;
    white-space:nowrap;
  }

  main{max-width:680px;margin:0 auto;padding:20px 16px;}
  .category{margin-top:30px; scroll-margin-top:100px;}
  .category h2{
    color:var(--primary);
    font-size:1.35rem;
    padding-bottom:8px;
    margin-bottom:14px;
    border-bottom:2px solid var(--gold);
    display:inline-block;
  }
  .dish{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    transition:box-shadow .15s ease;
  }
  .dish:hover{box-shadow:0 4px 14px rgba(0,0,0,0.06);}
  .dish-info{flex:1;}
  .dish-name{font-weight:700;font-size:1rem;color:var(--text);}
  .dish-desc{font-size:0.86rem;color:var(--muted);margin-top:4px;line-height:1.4;}
  .dish-tags{font-size:0.7rem;color:var(--primary);margin-top:6px;letter-spacing:0.3px;text-transform:uppercase;}
  .dish-price{
    font-weight:700;white-space:nowrap;font-size:0.95rem;
    color:var(--primary-dark);
    text-align:right;
    min-width:80px;
  }

  footer{
    text-align:center;
    font-size:0.78rem;
    color:var(--muted);
    margin-top:40px;
    padding:24px 16px;
    border-top:1px solid var(--border);
  }
  footer .addr{font-weight:700; color:var(--primary); margin-bottom:6px;}
  #loading{text-align:center;padding:60px 16px;color:var(--muted);font-style:italic;}
</style>
</head>
<body>

const SUPPORTED = ["de","en","it","fr","es","sv","da"];

function slugify(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function detectDefaultLang(){
  const browserLang = navigator.language.slice(0,2);
  return SUPPORTED.includes(browserLang) ? browserLang : "de";
}

function render(lang){
  if(!MENU_DATA[lang]){ lang = "de"; }
  const data = MENU_DATA[lang];
  document.getElementById('subtitle').textContent = data.subtitle;
  document.getElementById('tagline').textContent = data.tagline;
  document.getElementById('footer-note').textContent = data.footer;
  document.getElementById('hours').innerHTML = `<strong>${data.hours_label}:</strong> ${data.hours_text}`;

  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });

  const root = document.getElementById('menu-root');
  const navEl = document.getElementById('cat-nav');
  root.innerHTML = '';
  navEl.innerHTML = '';

  data.categories.forEach(cat=>{
    const slug = slugify(cat.name);
    const navLink = document.createElement('a');
    navLink.href = `#${slug}`;
    navLink.textContent = cat.name;
    navEl.appendChild(navLink);

    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    catDiv.id = slug;
    catDiv.innerHTML = `<h2>${cat.name}</h2>`;
    cat.items.forEach(item=>{
      catDiv.innerHTML += `
        <div class="dish">
          <div class="dish-info">
            <div class="dish-name">${item.name}</div>
            <div class="dish-desc">${item.desc}</div>
            ${item.allergens ? `<div class="dish-tags">${item.allergens}</div>` : ''}
          </div>
          <div class="dish-price">${item.price}</div>
        </div>`;
    });
    root.appendChild(catDiv);
  });

  document.documentElement.lang = lang;
  localStorage.setItem('menuLang', lang);
}

document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> render(btn.dataset.lang));
});

const savedLang = localStorage.getItem('menuLang');
render(savedLang && SUPPORTED.includes(savedLang) ? savedLang : detectDefaultLang());
</script>
